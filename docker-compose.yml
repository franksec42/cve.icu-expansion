# CVE.ICU Docker Compose Configuration
# Automated CVE data fetching and processing

services:
  cveicu:
    build:
      context: .
      dockerfile: Dockerfile
    image: cveicu:latest
    container_name: cveicu
    
    # Environment configuration
    environment:
      - UPDATE_INTERVAL=3600      # Update every hour (in seconds)
      - WEB_PORT=8090             # Web server port
      - TZ=UTC                    # Timezone
      # - PYTHONPATH=/app         # Python path (if needed)
    
    # Port mapping
    ports:
      - "8090:8090"
    
    # Volume mounts for persistent data
    volumes:
      # Output: HTML and JSON files - synced to local folder
      - ./web:/app/web
      
      # Cache: Downloaded NVD data, CVE V5 repo, etc.
      - ./data/cache:/app/data/cache
      
      # Logs: Build and server logs
      - ./logs:/var/log/cveicu
      
      # Optional: Mount templates for live editing (development)
      # - ./templates:/app/templates:ro
      
      # Optional: Mount site config for runtime changes
      - ./site_config.json:/app/site_config.json:ro
    
    # Restart policy
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 10m
    
    # Resource limits (optional, adjust as needed)
    # Note: Parsing the 1.4GB NVD JSON requires ~6-8GB RAM
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

# Named volumes (alternative to bind mounts)
# volumes:
#   cveicu-web:
#   cveicu-cache:
#   cveicu-logs:

networks:
  default:
    name: cveicu-network

