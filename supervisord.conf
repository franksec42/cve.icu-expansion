[supervisord]
nodaemon=true
user=root
logfile=/var/log/cveicu/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:webserver]
command=python -m http.server %(ENV_WEB_PORT)s
directory=/app/web
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/cveicu/webserver.err.log
stdout_logfile=/var/log/cveicu/webserver.out.log
priority=10

[program:scheduler]
command=/bin/bash -c 'while true; do sleep %(ENV_UPDATE_INTERVAL)s; /docker-entrypoint.sh update; done'
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/cveicu/scheduler.err.log
stdout_logfile=/var/log/cveicu/scheduler.out.log
priority=20

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

